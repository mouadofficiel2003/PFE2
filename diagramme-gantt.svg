  <text x="600" y="68" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" fill="#666666">Stage du 6 mars au 6 juillet 2026</text>

  <!-- Chart: x=300..1160 (w=860), y=110..620 -->
  <line x1="300" y1="108" x2="1160" y2="108" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="300" y1="620" x2="1160" y2="620" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="300" y1="108" x2="300" y2="620" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="1160" y1="108" x2="1160" y2="620" stroke="#5a5a5a" stroke-width="1.5"/>

  <!-- Month grid: 122 days, x = 300 + 860 * d/122 -->
  <line x1="483.3" y1="108" x2="483.3" y2="620" stroke="#dcdcdc" stroke-width="1"/>
  <line x1="694.8" y1="108" x2="694.8" y2="620" stroke="#dcdcdc" stroke-width="1"/>
  <line x1="913.3" y1="108" x2="913.3" y2="620" stroke="#dcdcdc" stroke-width="1"/>
  <line x1="1124.8" y1="108" x2="1124.8" y2="620" stroke="#dcdcdc" stroke-width="1"/>

  <text x="391.6" y="98" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c2c2c">Mars</text>
  <text x="589.0" y="98" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c2c2c">Avril</text>
  <text x="804.0" y="98" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c2c2c">Mai</text>
  <text x="1019.0" y="98" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c2c2c">Juin</text>
  <text x="1142.4" y="98" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c2c2c">Juil.</text>

  <text x="16" y="175" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c2c2c">Cahier des charges</text>
  <text x="16" y="196" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#777777">6 mars – 19 mars</text>

  <text x="16" y="302" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c2c2c">Conception UML</text>
  <text x="16" y="323" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#777777">20 mars – 19 avril</text>

  <text x="16" y="429" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c2c2c">Réalisation</text>
  <text x="16" y="450" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#777777">20 avril – 14 juin</text>

